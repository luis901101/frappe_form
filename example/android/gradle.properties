org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
android.enableJetifier=true
# Off because Flutter 3.44 auto-applies kotlin-android to plugin subprojects,
# which AGP 9's built-in Kotlin rejects. Re-enable once Flutter stops doing that.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 rejects getDefaultProguardFile('proguard-android.txt'), which
# flutter_inappwebview_android 1.1.3 (latest stable, via html_editor_enhanced)
# still uses. Remove once a stable release switches to
# proguard-android-optimize.txt (1.2.0-beta.3 already has).
android.r8.proguardAndroidTxt.disallowed=false
